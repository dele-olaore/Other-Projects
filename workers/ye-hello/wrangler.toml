name = "ye-hello"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

[vars]
ENVIRONMENT = "production"
# Overridden at deploy time with the merged commit sha (--var BUILD_REF:<sha>).
BUILD_REF = "dev"

[env.staging]
name = "ye-hello-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
BUILD_REF = "dev"
